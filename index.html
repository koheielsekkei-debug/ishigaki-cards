<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>階構成カード 経路ボタン</title>
<style>
:root{--ink:#1F2A44;--line:#333}
*{box-sizing:border-box}
body{margin:0;background:#eef0f4;font-family:"Meiryo UI","Yu Gothic UI","Hiragino Sans",sans-serif;color:#222;-webkit-user-select:none;user-select:none}
#fit{width:100%;overflow:hidden}
#world{position:relative;width:1280px;height:510px;transform-origin:0 0}
#head{position:absolute;left:8px;top:6px;width:1264px;height:30px;display:flex;align-items:center;gap:10px}
#head h1{font-size:17px;margin:0;color:var(--ink);white-space:nowrap}
#head .hint{font-size:10px;color:#666;flex:1}
button,select{font:inherit;font-size:10px;padding:3px 8px;border:1px solid #888;border-radius:4px;background:#fff;cursor:pointer}
button:hover{background:#f0f4ff}
button.on{background:#e6efff;border-color:#1a73e8}
#stage{position:absolute;left:8px;top:40px;width:952px;height:456px;background:#fff;border:1px solid #bbb;border-radius:4px;overflow:hidden}
#stage .b{position:absolute;border:1.5px solid var(--line);background:#fff}
#stage .roof{position:absolute;border:1px dashed #999;color:#999;font-size:8px;text-align:center}
#stage .fl{position:absolute;font-size:14px;font-weight:700;color:var(--ink);width:28px;text-align:right}
#stage .lab{position:absolute;font-size:10px;font-weight:700;color:var(--ink)}
#stage .corr{position:absolute;border:1.25px solid var(--line);background:#f2f2f2;font-size:8px;font-weight:700;color:#555;display:flex;align-items:center;padding-left:3px}
#stage .gl{position:absolute;left:0;right:0;height:2.5px;background:#222}
#ov{position:absolute;left:0;top:0;width:952px;height:456px;pointer-events:none;z-index:5}
.ev{position:absolute;border:2.5px solid #d84300;border-radius:3px;background:linear-gradient(90deg,rgba(255,138,0,.62),rgba(255,176,60,.52));box-shadow:0 0 0 2px #fff,0 0 9px 2px rgba(216,67,0,.6);z-index:8}
.ev::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed rgba(255,255,255,.75)}
.ev span{position:absolute;left:-3px;right:-3px;height:15px;line-height:13px;background:#d84300;border:1.5px solid #fff;border-radius:3px;font-size:10px;font-weight:900;color:#fff;text-align:center;letter-spacing:.5px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
#lines{position:absolute;left:0;top:0;width:952px;height:456px;pointer-events:none;z-index:6}
#cards{position:absolute;left:0;top:0;width:952px;height:456px}
.legend{position:absolute;left:8px;bottom:4px;display:flex;flex-wrap:wrap;gap:2px 8px;right:8px;font-size:8px;color:#333;z-index:7}
.legend i{display:inline-block;width:12px;height:9px;border:1px solid #888;margin-right:3px;vertical-align:-1px}
.card{position:absolute;width:68px;height:28px;border:.5px solid #7a7a7a;padding:1px 2px;text-align:center;display:flex;flex-direction:column;justify-content:center;line-height:1.15;cursor:grab;overflow:hidden;touch-action:none}
.card.ext{border:none;padding:0;align-items:center;overflow:visible}
.card .ex{display:flex;flex-direction:column;align-items:center;transform:scale(1.2);transform-origin:center}
.card .h{font-size:5px;color:#666;white-space:nowrap;overflow:hidden}
.card .h b{color:#e02020}
.card .n{font-size:var(--fs,7.5px);font-weight:700;color:#1a1a1a}
.card .n.s{--fs:6.5px}
.card .n small{font-size:.75em;font-weight:400;color:#444}
.card .n em{font-size:.8em;color:#b03030;font-style:normal}
.card.rel{outline:2.5px solid var(--rc,#e02020);z-index:7;box-shadow:0 0 0 1.5px #fff,0 1px 5px rgba(0,0,0,.35)}
.card .pn{position:absolute;left:1px;top:1px;min-width:9px;height:9px;line-height:9px;border-radius:5px;background:#1a73e8;color:#fff;font-size:7px;font-weight:700;text-align:center;padding:0 2px}
.card.pickA{outline:2.5px dashed #1a73e8;z-index:7}
.card.hasrt::after{content:"";position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%;background:var(--hc,#e02020);box-shadow:0 0 0 1px #fff}
.card.drag{z-index:99;box-shadow:0 3px 8px rgba(0,0,0,.35);cursor:grabbing}
#tray .card{position:relative;margin:0 3px 3px 0;display:inline-flex;vertical-align:top}
#side{position:absolute;left:968px;top:40px;width:304px;height:456px;background:#fff;border:1px solid #bbb;border-radius:4px;display:flex;flex-direction:column}
#tabs{display:flex;flex-wrap:wrap;gap:3px;padding:4px;border-bottom:1px solid #ddd}
#tabs button{padding:2px 6px;font-size:9px}
#tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#tray{height:178px;flex:none;overflow-y:auto;padding:4px 0 0 4px;background:#fafafa;font-size:0}
#tray .empty{font-size:9px;color:#888;padding:6px}
#rels{padding:6px;border-top:2px solid #ccc;flex:1;display:flex;flex-direction:column;min-height:0}
#rels h3{margin:0 0 4px;font-size:11px;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
#rlist{flex:1;overflow-y:auto}
.rb{display:flex;align-items:stretch;gap:3px;margin-bottom:4px}
.rb .go{flex:1;text-align:left;padding:6px 8px;font-size:10px;font-weight:700;line-height:1.25;border:1.5px solid var(--c);border-radius:6px;background:#fff;color:#222;display:flex;gap:6px;align-items:center}
.rb .go i{flex:none;width:18px;border-top:3px dotted var(--c)}
.rb .go small{display:block;font-weight:400;color:#777;font-size:8px}
.rb .go.on{background:var(--c);color:#fff}
.rb .go.on i{border-top-color:#fff}
.rb .go.on small{color:#fff;opacity:.85}
.rb .x{padding:0 6px;font-size:10px;border-color:#ccc;color:#888}
#msg{font-size:9px;color:#1a73e8;min-height:12px;margin-top:2px}
g.rt{opacity:0;transition:opacity .35s}
g.rt.on{opacity:1}
path.halo{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
path.ln{fill:none;stroke-width:2.6;stroke-dasharray:3 5;stroke-linecap:round;stroke-linejoin:round;animation:fl .7s linear infinite}
.still path.ln{animation:none}
@keyframes fl{to{stroke-dashoffset:-8}}
</style>
</head>
<body>
<div id="fit"><div id="world">
  <div id="head">
    <h1>階構成の検討　断面図 × 部屋名カード × 経路ボタン</h1>
    <span class="hint">●印のカードをクリックすると線が出て、もう一度押すと消えます（右下の経路ボタンでも同じ）／カードはドラッグで移動（線も追従）／置き場↔ステージへもドラッグ</span>
    <button id="bAll">すべて消す</button>
    <button id="bAnim" class="on">線を動かす</button>
    <button id="bSave">保存(JSON)</button>
    <button id="bLoad">読込</button>
    <button id="bNew" style="border-color:#1a73e8;color:#1a73e8;font-weight:700">＋カード追加</button>
    <button id="bReset">初期化</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
  <div id="stage">
    <div id="bg"></div>
    <div id="cards"></div>
    <div id="ov"></div>
    <svg id="lines" viewBox="0 0 952 456"></svg>
    <div class="legend" id="legend"></div>
  </div>
  <div id="side">
    <div id="tabs"></div>
    <div id="tray"></div>
    <div id="rels">
      <h3>経路ボタン <button id="bAdd">＋経路を追加</button></h3>
      <div id="rlist"></div>
      <div id="msg"></div>
    </div>
  </div>
</div></div>
<dialog id="dlg"><form method="dialog" id="dform">
  <h3 style="margin:0 0 8px;font-size:13px;color:#1F2A44">カードを追加</h3>
  <label>部屋名<input id="fName" required maxlength="30"></label>
  <label>注記（任意）<input id="fNote" maxlength="30" placeholder="例：48名／上側"></label>
  <label>棟<select id="fSide"><option value="R">右棟（新棟）</option><option value="L">左棟（介護棟）</option></select></label>
  <label>置く階<select id="fFl"><option>5F</option><option>4F</option><option>3F</option><option>2F</option><option selected>1F</option></select></label>
  <label>色<select id="fCol"></select></label>
  <div style="margin-top:10px;text-align:right"><button type="button" id="fCancel">キャンセル</button> <button type="submit" id="fOk" style="background:#1a73e8;color:#fff;border-color:#1a73e8">追加</button></div>
</form></dialog>
<style>
#dlg{border:1px solid #888;border-radius:8px;padding:12px 14px;width:260px;font-size:11px}
#dlg::backdrop{background:rgba(0,0,0,.25)}
#dlg label{display:block;margin-bottom:6px;color:#444}
#dlg input,#dlg select{display:block;width:100%;margin-top:2px;font:inherit;font-size:12px;padding:4px 6px;border:1px solid #aaa;border-radius:4px}
</style>

  document.getElementById('legend').innerHTML = [['共用部・待合','FFFDE0'],['医事課・CE・SE','DDD9C3'],['外来・病室・HCU','FDDDBD'],['検査・透析','D9F7D2'],['放射線・アンギオ','E9DDF9'],['内視鏡・厨房','CFE6FA'],['薬剤','C4DDFB'],['救急','FFD9F2'],['発熱','FFB3D9'],['地域連携・入退院','F2DCDB'],['手術・中材','FFD0E4'],['リハビリ','DBEEF4'],['管理・スタッフ・設備','E3E3E3'],['左棟（改修案）','FFF2B3'],['EV（橙）','FF8A00']].map(a => `<span><i style="background:#${a[1]}"></i>${a[0]}</span>`).join('') + `<span style="color:#888">※断面図は階高の比率をそろえない模式図</span>`;
})();
const C = {}, IDX = {};
D.cards.forEach((d,i) => IDX[d.id] = i);

/* ---------- カード ---------- */
function curFloor(id){
  const s = S.cards[id]; if(!s || s.place !== 'stage') return null;
  const cy = s.y + CH/2;
  for(const f of FL){ if(cy >= BAND[f][0] && cy < BAND[f][1]) return f; }
  return null;
}
function esc(t){ return String(t).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function cardEl(d){
  const e = document.createElement('div'); e.className = 'card'; e.dataset.id = d.id;
  e.style.width = ((d.w) || (d.side === 'L' ? 62 : 68)) + 'px'; e.style.background = '#' + (d.col || (d.side === 'L' ? COL.L : COL[d.fl]));
  e.innerHTML = `<div class="h"></div><div class="n${d.name.length > 9 ? ' s' : ''}">${esc(d.name)}${d.mult ? ' <em>' + esc(d.mult) + '</em>' : ''}${d.note ? ' <small>' + esc(d.note) + '</small>' : ''}</div>`;
  if(d.ext){ e.classList.add('ext'); e.style.background = 'transparent'; e.innerHTML = '<div class="h"></div><div class="ex"><div class="n" style="font-size:8px;line-height:9px">'+(d.lab || esc(d.name))+'</div><svg style="transform:scaleX('+(d.noflip ? 1 : -1)+')" viewBox="0 0 24 24" width="17" height="17"><circle cx="13" cy="4" r="2.8" fill="#222"/><path d="M12 8 L9 14 L11 15 M12 8 L15 13 L18 12 M12 8 L12 15 L9 22 M12 15 L16 20 L16 23" stroke="#222" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'; }
  e.title = d.name + (d.note ? '（' + d.note + '）' : '');
  e.addEventListener('pointerdown', ev => down(ev, d.id));
  if(d.user) e.addEventListener('contextmenu', ev => { ev.preventDefault(); if(confirm('追加カード「' + d.name + '」を削除しますか？')){ S.extra = S.extra.filter(x => x.id !== d.id); delete S.cards[d.id]; S.routes = S.routes.filter(r => !chain(r).includes(d.id)); save(); location.reload(); } });
  return e;
}
function head(id){
  const d = D.cards[IDX[id]], el = C[id].querySelector('.h'), cf = curFloor(id);
  el.innerHTML = (cf && cf !== d.fl && !d.nohead) ? esc(d.fl) + ' <b>→' + cf + '</b>' : '';
  el.style.display = el.innerHTML ? '' : 'none';
  C[id].title = d.name + (d.note ? '（' + d.note + '）' : '') + (d.org ? ' ／ ' + d.org : '') + (d.area ? ' ' + d.area + '㎡' : '');
}
D.cards.forEach(d => C[d.id] = cardEl(d));
function fitCard(e){
  if(e.classList.contains('ext')) return;
  const n = e.querySelector('.n'); if(!n || !e.offsetParent) return;
  n.style.removeProperty('--fs'); let fs = parseFloat(getComputedStyle(n).fontSize) || 7.5, g = 0;
  while(e.scrollHeight > e.clientHeight + 0.5 && fs > 4.2 && g++ < 14){ fs -= 0.4; n.style.setProperty('--fs', fs + 'px'); }
}
function fitAll(){ Object.values(C).forEach(fitCard); }
function renderTray(){
  tray.innerHTML = ''; let n = 0;
  D.cards.forEach(d => {
    const s = S.cards[d.id], e = C[d.id];
    if(s.place === 'tray'){ e.style.left = e.style.top = ''; e.style.position = ''; e.style.display = (d.group === tab) ? '' : 'none'; if(d.group === tab) n++; tray.appendChild(e); }
  });
  if(!n){ const m = document.createElement('div'); m.className = 'empty'; m.textContent = 'このタブのカードはすべてステージに置かれています'; tray.appendChild(m); }
  const cnt = {}; D.cards.forEach(d => { if(S.cards[d.id].place === 'tray') cnt[d.group] = (cnt[d.group]||0) + 1; });
  const tabs = document.getElementById('tabs'); tabs.innerHTML = '';
  D.groups.forEach(g => { const b = document.createElement('button'); b.textContent = g.label + '(' + (cnt[g.key]||0) + ')'; if(g.key === tab) b.className = 'on'; b.onclick = () => { tab = g.key; renderTray(); fitAll(); }; tabs.appendChild(b); });
}
function placeAll(){
  D.cards.forEach((d,i) => { IDX[d.id] = i; if(!C[d.id]) C[d.id] = cardEl(d); if(!S.cards[d.id]) S.cards[d.id] = {place:d.place, x:d.x, y:d.y}; });
  D.cards.forEach(d => { const s = S.cards[d.id], e = C[d.id]; if(s.place === 'stage'){ e.style.display = ''; e.style.position = 'absolute'; e.style.left = s.x + 'px'; e.style.top = s.y + 'px'; cardsEl.appendChild(e); } });
  renderTray(); D.cards.forEach(d => head(d.id)); renderRoutes(); updateLines(); fitAll();
}

/* ---------- 経路（自動ルーティング） ---------- */
const cw = id => (D.cards[IDX[id]] && D.cards[IDX[id]].w) || CW;
function ctr(id){ const s = S.cards[id]; return s && s.place === 'stage' ? [s.x + cw(id)/2, s.y + CH/2] : null; }
const sideOf = id => (S.cards[id].x + cw(id)/2) < G.split ? 'L' : 'R';
const corrAt = f => G.corr.find(c => c.floor === f);
const nodeCorr = f => { const c = corrAt(f); return [c.x + c.w/2, c.y + c.h/2]; };
function nodeEv(side, f){
  const e = side === 'L' ? G.evL : G.evR, c = corrAt(f);
  const y = f === '1F' ? BAND['1F'][1] - 9 : (c ? c.y + c.h/2 : (BAND[f][0] + BAND[f][1]) / 2);
  return [e.x + e.w/2, y];
}
const chain = r => [r.a].concat(r.via || [], [r.b]);
function segPts(ia, ib, mode){
  const a = ctr(ia), b = ctr(ib); if(!a || !b) return null;
  const fa = curFloor(ia), fb = curFloor(ib), sa = sideOf(ia), sb = sideOf(ib), P = [a];
  const direct = () => { const mx = (a[0] + b[0]) / 2; return [a, [mx, a[1]], [mx, b[1]], b]; };
  if(mode === 'direct' || !fa || !fb || (sa === sb && fa === fb)) return direct();
  const ex = s => (s === 'L' ? G.evL : G.evR).x + (s === 'L' ? G.evL : G.evR).w / 2;
  if(sa === sb){ P.push([ex(sa), a[1]], [ex(sa), b[1]]); }
  else {
    const fn = x => parseInt(x), cf = G.corr.map(c => c.floor);
    let fc = corrAt(fa) ? fa : (corrAt(fb) ? fb : null);
    if(!fc) fc = cf.slice().sort((p, q) => (Math.abs(fn(p) - fn(fa)) + Math.abs(fn(p) - fn(fb))) - (Math.abs(fn(q) - fn(fa)) + Math.abs(fn(q) - fn(fb))) || fn(q) - fn(p))[0];
    if(!fc) return direct();
    if(sa === 'L'){
      if(fc !== fa) P.push([ex('L'), a[1]], nodeEv('L', fc));
      P.push(nodeCorr(fc), nodeEv('R', fc)); if(fb !== fc) P.push([ex('R'), b[1]]);
    } else {
      if(fa !== fc) P.push([ex('R'), a[1]], nodeEv('R', fc)); else P.push(nodeEv('R', fa));
      P.push(nodeCorr(fc)); if(fb !== fc) P.push(nodeEv('L', fc), [ex('L'), b[1]]);
    }
  }
  P.push(b); return P;
}
function routePts(r){
  const ids = chain(r); let P = [];
  for(let i = 0; i < ids.length - 1; i++){ const q = segPts(ids[i], ids[i+1], r.mode); if(!q) return null; P = P.concat(i ? q.slice(1) : q); }
  return P;
}
function pathOf(r){
  const P = routePts(r); if(!P) return null;
  let d = 'M' + P[0][0] + ' ' + P[0][1];
  for(let i = 1; i < P.length; i++) d += ` L${P[i][0]} ${P[i-1][1]} L${P[i][0]} ${P[i][1]}`;
  return d;
}
const colorOf = r => PAL[S.routes.indexOf(r) % PAL.length];
const NS = 'http://www.w3.org/2000/svg';
const GR = {};
function updateLines(){
  svg.classList.toggle('still', !anim);
  S.routes.forEach(r => {
    let g = GR[r.id];
    if(!g){
      g = GR[r.id] = document.createElementNS(NS, 'g'); g.setAttribute('class', 'rt');
      g.innerHTML = '<path class="halo"/><path class="ln"/><circle r="3.6"><animateMotion dur="2.4s" repeatCount="indefinite"/></circle>';
      svg.appendChild(g);
    }
    const d = pathOf(r), c = colorOf(r);
    g.style.display = d ? '' : 'none';
    if(d){ g.children[0].setAttribute('d', d); g.children[1].setAttribute('d', d); g.children[1].setAttribute('stroke', c);
      g.children[2].setAttribute('fill', c); g.children[2].firstChild.setAttribute('path', d); }
    g.classList.toggle('on', active.has(r.id));
  });
  Object.keys(GR).forEach(id => { if(!S.routes.some(r => r.id === id)){ GR[id].remove(); delete GR[id]; } });
  Object.values(C).forEach(e => { e.classList.remove('rel', 'hasrt'); e.style.removeProperty('--rc'); e.style.removeProperty('--hc'); });
  S.routes.forEach(r => chain(r).forEach(id => { if(C[id]){ C[id].classList.add('hasrt'); C[id].style.setProperty('--hc', colorOf(r)); } }));
  S.routes.forEach(r => { if(active.has(r.id)) chain(r).forEach(id => { if(C[id]){ C[id].classList.add('rel'); C[id].style.setProperty('--rc', colorOf(r)); } }); });
}
function nm(id){ const d = D.cards[IDX[id]]; return d.name + (d.note ? '(' + d.note + ')' : ''); }
function renderRoutes(){
  const l = document.getElementById('rlist'); l.innerHTML = '';
  if(!S.routes.length) l.innerHTML = '<div style="font-size:9px;color:#888">経路がありません。「＋経路を追加」を押し、2枚のカードを順にクリックしてください。</div>';
  S.routes.forEach(r => {
    const row = document.createElement('div'); row.className = 'rb'; row.style.setProperty('--c', colorOf(r));
    row.innerHTML = `<button class="go${active.has(r.id) ? ' on' : ''}"><i></i><span>${esc(r.label)}<small>${esc(chain(r).map(nm).join(' → '))}</small></span></button><button class="x" title="この経路を削除">✕</button>`;
    row.querySelector('.go').onclick = () => { active.has(r.id) ? active.delete(r.id) : active.add(r.id); renderRoutes(); updateLines(); };
    row.querySelector('.go').ondblclick = () => { const t = prompt('経路の名前', r.label); if(t){ r.label = t; save(); renderRoutes(); } };
    row.querySelector('.x').onclick = () => { if(confirm('「' + r.label + '」を削除しますか？')){ S.routes = S.routes.filter(x => x !== r); active.delete(r.id); S.removed.push(r.id); save(); renderRoutes(); updateLines(); } };
    l.appendChild(row);
  });
}

/* ---------- ドラッグ ---------- */
function fit(){ K = Math.max(0.2, Math.min(window.innerWidth / 1280, 2.2)); world.style.transform = 'scale(' + K + ')'; document.getElementById('fit').style.height = (510 * K) + 'px'; }
window.addEventListener('resize', fit); fit();
function wpt(ev){ const r = world.getBoundingClientRect(); return [(ev.clientX - r.left) / K, (ev.clientY - r.top) / K]; }
let dr = null;
function down(ev, id){
  if(ev.button !== 0) return;
  const e = C[id], r = e.getBoundingClientRect(), wr = world.getBoundingClientRect();
  dr = {id, sx: ev.clientX, sy: ev.clientY, moved: false, ox: (r.left - wr.left) / K, oy: (r.top - wr.top) / K, prev: {...S.cards[id]}};
  e.setPointerCapture(ev.pointerId); e.onpointermove = move; e.onpointerup = up; e.onpointercancel = up;
}
function move(ev){
  if(!dr) return; const e = C[dr.id];
  if(!dr.moved){
    if(Math.hypot(ev.clientX - dr.sx, ev.clientY - dr.sy) < 4) return;
    dr.moved = true; e.classList.add('drag'); e.style.position = 'absolute'; e.style.display = ''; world.appendChild(e);
  }
  const x = dr.ox + (ev.clientX - dr.sx) / K, y = dr.oy + (ev.clientY - dr.sy) / K;
  e.style.left = x + 'px'; e.style.top = y + 'px';
  const s = S.cards[dr.id]; s.place = 'stage'; s.x = x - 8; s.y = y - 40; updateLines(); head(dr.id);
}
function up(ev){
  const e = C[dr.id], id = dr.id; e.onpointermove = e.onpointerup = e.onpointercancel = null;
  const was = dr; dr = null;
  if(!was.moved){ click(id); return; }
  e.classList.remove('drag');
  const [wx, wy] = wpt(ev), s = S.cards[id];
  if(wx >= 968 && wy >= 40 && wy <= 40 + 24 + 180){ s.place = 'tray'; }
  else if(wx >= 8 && wx <= 960 && wy >= 40 && wy <= 496){
    s.place = 'stage'; s.x = Math.round(Math.max(0, Math.min(952 - cw(id), (wx - 8) - cw(id)/2))); s.y = Math.round(Math.max(0, Math.min(456 - CH, (wy - 40) - CH/2)));
  } else Object.assign(s, was.prev);
  save(); placeAll();
}
function msg(t){ document.getElementById('msg').textContent = t; }
function pickMsg(){ const n = pick.ids.length; msg(n ? n + '枚選択中：次のカードをクリック（何枚でも可）／2枚以上で「決定」ボタンかEnterキー、Escで取消' : '1枚目のカードをクリックしてください（もう一度押すと取り消し）'); document.getElementById('bAdd').textContent = n >= 2 ? '決定（' + n + '枚）' : '＋経路を追加'; }
function pickEnd(){ if(pick) pick.ids.forEach(i => { C[i].classList.remove('pickA'); const b = C[i].querySelector('.pn'); if(b) b.remove(); }); pick = null; const b = document.getElementById('bAdd'); b.classList.remove('on'); b.textContent = '＋経路を追加'; }
function pickFinish(){
  const ids = pick.ids.slice(); if(ids.length < 2) return; pickEnd();
  const def = ids.map(nm).join(' → '), label = prompt('経路の名前', def); if(label === null){ msg(''); return; }
  const rid = 'u' + Date.now(); S.routes.push({id: rid, label: label || def, a: ids[0], b: ids[ids.length-1], via: ids.slice(1, -1), mode: 'auto'});
  active.add(rid); msg('追加しました（ボタンで表示/非表示）'); save(); renderRoutes(); updateLines();
}
function click(id){
  if(!pick){
    const rs = S.routes.filter(r => chain(r).includes(id)); if(!rs.length) return;
    const any = rs.some(r => active.has(r.id));
    rs.forEach(r => any ? active.delete(r.id) : active.add(r.id));
    renderRoutes(); updateLines(); return;
  }
  if(pick.ids[pick.ids.length-1] === id) return;
  pick.ids.push(id); C[id].classList.add('pickA');
  const b = document.createElement('b'); b.className = 'pn'; b.textContent = pick.ids.length; C[id].appendChild(b);
  pickMsg();
}

/* ---------- ボタン ---------- */
document.addEventListener('keydown', e => { if(!pick) return; if(e.key === 'Enter' && pick.ids.length >= 2){ e.preventDefault(); pickFinish(); } else if(e.key === 'Escape'){ pickEnd(); msg('取り消しました'); } });
document.getElementById('bAdd').onclick = () => {
  const b = document.getElementById('bAdd');
  if(pick){ if(pick.ids.length >= 2) pickFinish(); else { pickEnd(); msg(''); } return; }
  pick = {ids: []}; b.classList.add('on'); pickMsg();
};
document.getElementById('bAll').onclick = () => { active.clear(); renderRoutes(); updateLines(); };
document.getElementById('bAnim').onclick = e => { anim = !anim; e.target.classList.toggle('on', anim); updateLines(); };
document.getElementById('bSave').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'})); a.download = '階構成カード_配置と経路.json'; a.click(); };
document.getElementById('bLoad').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = e => {
  const f = e.target.files[0]; if(!f) return; const r = new FileReader();
  r.onload = () => { try{ const s = JSON.parse(r.result); if(s.cards && s.routes){ S = s; S.extra = S.extra || []; S.extra.forEach(d => { if(!D.cards.some(c => c.id === d.id)) D.cards.push(d); }); sync(); active.clear(); save(); placeAll(); } else alert('形式が違います'); }catch(x){ alert('読み込めませんでした'); } };
  r.readAsText(f);
};
document.getElementById('bReset').onclick = () => { if(confirm('配置と経路を最初の状態に戻します。よろしいですか？')){ S = initial(); active.clear(); save(); placeAll(); } };

/* ---------- カード追加 ---------- */
const DEPT = [['共用部・待合','FFFDE0'],['医事課・CE・SE','DDD9C3'],['外来・病室・HCU','FDDDBD'],['検査・透析','D9F7D2'],['放射線・アンギオ','E9DDF9'],['内視鏡・厨房','CFE6FA'],['薬剤','C4DDFB'],['救急','FFD9F2'],['発熱','FFB3D9'],['地域連携・入退院','F2DCDB'],['手術・中材','FFD0E4'],['リハビリ','DBEEF4'],['管理・スタッフ・設備','E3E3E3']];
function fillColSel(){
  const side = document.getElementById('fSide').value, sel = document.getElementById('fCol');
  sel.innerHTML = side === 'L' ? '<option value="FFF2B3">左棟（改修案）</option>' : DEPT.map(a => `<option value="${a[1]}">${a[0]}</option>`).join('');
}
function freeSlot(side, fl, w){
  const [y0,y1] = BAND[fl]; const x0 = side === 'L' ? G.LX + 4 : (fl === '5F' ? G.RX + G.RW*.2 + 4 : G.RX + 4);
  const x1 = side === 'L' ? G.LX + G.LW - w - 2 : (fl === '5F' ? G.RX + G.RW*.8 - w - 4 : G.RX + G.RW - w - 4);
  const st = D.cards.filter(d => S.cards[d.id] && S.cards[d.id].place === 'stage');
  for(let y = y0 + 3; y + CH <= y1 - 2; y += CH + 3) for(let x = x0; x <= x1; x += w + 3){
    if(!st.some(d => { const s = S.cards[d.id], ww = cw(d.id); return x < s.x + ww && x + w > s.x && y < s.y + CH && y + CH > s.y; })) return [Math.round(x), Math.round(y)];
  }
  return null;
}
function addCard(f){
  const w = f.side === 'L' ? 62 : 68, pos = freeSlot(f.side, f.fl, w);
  const d = {id:'u' + Date.now(), side:f.side, fl:f.fl, name:f.name, note:f.note, org:'', area:'', mult:'', place: pos ? 'stage' : 'tray', x: pos ? pos[0] : 0, y: pos ? pos[1] : 0, group: f.side === 'L' ? 'L' : f.fl, col:f.col, w, user:true};
  S.extra.push(d); D.cards.push(d); IDX[d.id] = D.cards.length - 1; C[d.id] = cardEl(d);
  S.cards[d.id] = {place:d.place, x:d.x, y:d.y};
  if(!pos){ tab = d.group; msg('空きが無いので置き場に追加しました（ドラッグして配置）'); } else msg('「' + d.name + '」を' + f.fl + 'に追加しました（ドラッグで移動／右クリックで削除）');
  save(); placeAll();
}
document.getElementById('bNew').onclick = () => { fillColSel(); document.getElementById('dform').reset(); fillColSel(); document.getElementById('dlg').showModal(); setTimeout(() => document.getElementById('fName').focus(), 30); };
document.getElementById('fSide').onchange = fillColSel;
document.getElementById('fCancel').onclick = () => document.getElementById('dlg').close();
document.getElementById('dform').onsubmit = ev => {
  const name = document.getElementById('fName').value.trim(); if(!name) return;
  addCard({name, note:document.getElementById('fNote').value.trim(), side:document.getElementById('fSide').value, fl:document.getElementById('fFl').value, col:document.getElementById('fCol').value});
};
placeAll();
</script>
